services:
  postgres:
    image: postgres:16
    container_name: subscription-keeper-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keeper}
      POSTGRES_DB: ${POSTGRES_DB:-keeper}
    ports:
      - "5432:5432"
    volumes:
      - keeper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keeper}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  keeper-pgdata:
